    result: passed
    reason:
      text: 打票、校验、存取及出站注入实现与证据未变。
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 每个账号拥有独立的打票开关，默认关闭，存储在账号 `extra` 的 `codex_ticket_enabled`
      布尔键；全局开关是总开关，全局关闭时账号级开关一律失效；只有「全局开 + 账号开 + 账号资格符合 +
      出站模型属于受管列表」四项同时满足时才打票与注入；账号级关闭（或资格不符）的账号既不参与打票也不注入门票，且不受缺票拦截影响。"
    result: passed
    reason:
      text: 账号开关、全局开关、资格及模型门控成立。
      truncated: false
  - id: A3
