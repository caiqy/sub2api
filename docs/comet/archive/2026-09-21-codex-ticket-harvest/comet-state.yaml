  - id: A1
    source: brief.md
    text: "A1: 恢复后的实现包含打票与注入全链路：后台 harvester
      对已开启打票开关且资格符合的账号，按全局探测周期对每个受管模型发起合成探针，仅接受 HTTP 200、长度等于目标长度、且带有 `gAAAAA`
