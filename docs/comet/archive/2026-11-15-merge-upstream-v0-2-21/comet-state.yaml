 400。"},{"id":"A5","source":"brief.md","text":"[ ] A5 协议和请求体：最终映射/effort/DeepSeek 归一化后生成有效出站 body handle；跨重试可回放，上游等待不持有完整原始大 body；读取失败不退回全内存；timeout、cancel、panic、非空 response+error 均正确关闭/释放。budget 缺省自适应、显式 0 保持关闭限制。"},{"id":"A6","source":"brief.md","text":"[ ] A6 WebSocket：TTFT 事件口径配置生效；后续轮失败不重发首轮 payload，按上游 1013 行为退出；websearch 仅完整历史允许重连；每轮保留 fork 输入限额、资格、映射、流量快照与失败语义。"},{"id":"A7","source":"brief.md","text":"[ ] A7 图片与工具：原生图片成功/错误状态及 keepalive 正确，媒体引用和 tool 结果顺序、encrypted_function_args/namespace、Gemini thought 与正文分离完整；复合分组映射、image 工作流/鉴权/计费保留。"},{"id":"A8","source":"brief.md","text":"[ ] A8 TTL 与收费：30m/12h 字段贯穿用量/渠道/区间/账号统计/DTO/UI；12h 缺省定价和显式 generic/12h 配置按上游优先级，free-input/Fast/cache-read 修复生效；fork 流量费只计完整成功且不进入账号成本回退，订阅窗口、事务/幂等/缓存失效保持。"},{"id":"A9","source":"brief.md","text":"[ ] A9 迁移安全：完整文件名为主键、trim 后 SHA256 保持；同号不同名的新迁移独立执行。空库安装、已有 fork 至253升级、重复执行、非事务索引无效状态恢复均有真实检查，历史迁移字节不变，数据不被回填破坏。"},{"id":"A10","source":"brief.md","text":"[ ] A10 其余上游行为：EasyPay 实例 refund=0/1、Refresh Token 并发单次消费、安全审计即时唤醒、Antigravity 用量/限流、模型目录和 effort policy 有对应回归结果；原有鉴权安全与 fork 业务测试继续通过。"},{"id":"A11","source":"brief.md","text":"[ ] A11 前端验收：测试、typecheck、i18n/build 成功；浏览器实际核验渠道 TTL/价格、Keys 统计、账号用量、设置保存与充值精度，同时检查 fork 输入限制/流量费/订阅入口没有回退；不能用类型检查替代浏览器。"},{"id":"A12","source":"brief.md","text":"[ ] A12 检查与交付：后端全套测试、必要集成、lint 和前端检查记录真实结果；新的独立 Verifier 覆盖全部验收项，失败/跳过不记通过；组长验收后按 Runtime 完成本地 main 合并及学习检查。测试数据库/服务停止后检查本轮端口关闭，交付提交、证据及剩余风险。"}],"children":null,"formalHash":"12c2ac0d81ad6569829e675ccf42fada8993bed8bf2b72b438598fbafbc43238","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"9e39bc74abcabddcdf3b09dcac0452b86939fb6eb44d4ecc713dbb3d61ed39e7","contractHash":"7b28e6baf90b9839501ada0d258b2fb5efe39b33ad43dd0c49020e2e8bc09009","inputHash":"eda60217b3098356daa7d882f69fc269c0f806d08a10b86f762457334c605a15","legacyFingerprint":"884935232a8b358a1ebbd068c3089f9bbc812814473564f9538dca60d5fc92db","source":"b