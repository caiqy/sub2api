0的订阅请求仍走订阅，不回落余额。"},{"id":"A6","source":"brief.md","text":"A6：失败、超时、客户端流式断开、输入未知无流量扣款；正常成功一次请求收费一次，多次内部重试/重复结算不重复，模型原有费用保留；输入未知留有原因。"},{"id":"A7","source":"brief.md","text":"A7：请求开始后调价、改阈值、切换开关不改变本单位金额；下一请求使用新配置/授权。历史依据可复算、旧记录为0且不被追扣，用户授权变更使鉴权缓存失效。"},{"id":"A8","source":"brief.md","text":"A8：同步各平台文本/图片/音频入口与别名适用同规则；批处理、异步图片、异步视频及其状态/下载结算不收流量费、不执行新授权门槛，原模型费与硬限制保持。"},{"id":"A9","source":"brief.md","text":"A9：OpenAI Responses WS按每轮原始客户端payload判断准入、冻结并结算；异常终态、客户端断流drain、部分图片模型成功例外不误收流量费，升级后错误通过协议发送。"},{"id":"A10","source":"brief.md","text":"A10：Grok实时语音按本次提案的整连接累计输入，在正常1000关闭且有既有可结算音频时收一次；异常关闭免流量费，未授权累计超阈值时协议报错并关闭，模型费保持原规则。"},{"id":"A11","source":"brief.md","text":"A11：simple普通路径仅记流量费不扣余额/订阅，simple Key窗口模式仅纳入窗口；标准模式同样输入按规则实际收费。"},{"id":"A12","source":"brief.md","text":"A12：个人资料显示当前价格与默认关闭开关；管理员功能开关表单可保存合法设置；管理员/用户账单均显示流量费、精确输入计费依据和可鼠标悬停/键盘聚焦的问号提示“包含往返双向流量”；总费用与导出已有总额一致，不新增导出分项，原输入/输出/总计展示保留。"}],"children":null,"formalHash":"5435bc075f9d89187f0b6ed9cdcf790874e7b678baceab78d3b25aee285ea178","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"b5d5dcbbcb17fe78830cc485932e6ddf5717f883b2e2748da2f30c18c9312b07","contractHash":"657e13965a4f06d7c2f0a5fd4a76684ac7f86153d92a3222dd414afdfae93eb5","inputHash":"d0755f0ebd484abcf9b25f1cf470a7e0bd42fc52e3b5c9ff1f29a098a38869fb","legacyFingerprint":"60217a6d49d02d4737657e02a682a94e777cb238a3fac12b454c077e2836402c","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"2602027709d296f684e6a9b36390a44a342f1cbcaa2b2e5c6006941ca0228ea8","contractHash":"1e1b2cede1cabdb3241b817b629d9e06ada8c956f4c6029c9b462236c0fc1da4","inputHash":"e85382608a3cc9fce63acf974e6597d867f530605ea462e23df33a8e8fb20dc5","legacyFingerprint":"27fc3eba0bf49f47b2de6bf37765a42f9b46507a9e7d8df58cda715cf3e02eed","source":"specs/traffic-billing/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shap