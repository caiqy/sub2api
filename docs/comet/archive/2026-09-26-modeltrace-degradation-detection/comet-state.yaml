    source: specs/modeltrace-degradation-detection/spec.md
    text: 单轮与多轮评分 - **WHEN** 分别完成 1、2 或 3 轮有效挑战 - **THEN**
      各自使用相应样本数校准，归因第一名等于有效目标则记录正常，否则记录降智；概率和指纹库版本可查询。
    result: passed
    reason:
      text: 独立读取固定上游 commit 的 fingerprint-core.js，核对本地边缘/有序指纹聚合和 softmax 校准；正式 1/2/3
        轮固定样本概率对照通过，归因第一名按有效目标直接判断，版本可查询。
      truncated: false
  - id: A11
    source: specs/modeltrace-degradation-detection/spec.md
    text: 部分失败 - **WHEN** 请求 3 轮检测但仅 2 轮有效，或上游返回错误 - **THEN**
      历史记录为失败并展示有效轮次和脱敏原因，不自动补发、不覆盖账号此前有效结论。
    result: passed
    reason:
      text: 第 3 轮失败时保留 2 个有效轮次并立即结束，不补发；Finish 强制清空失败结论且不更新摘要；正式部分失败测试及真实 PostgreSQL
        失败不覆盖检查通过。
      truncated: false
  - id: A12
    source: specs/modeltrace-degradation-detection/spec.md
