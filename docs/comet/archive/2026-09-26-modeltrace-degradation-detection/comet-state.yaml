    text: 账号和模型隔离 - **WHEN** 管理员选择某 OpenAI 账号及一个支持的模型发起检测 - **THEN**
      探针使用该账号的凭据归属、协议及业务代理，记录选择模型与有效目标模型；不得换用其他账号并将其结果归入所选账号。
    result: passed
    reason:
      text: ResolveModelTraceTarget 保留所选账号路由身份、解析影子凭据、映射及透传规则，ProbeModelTrace
        使用业务代理和对应协议，发送前拒绝不支持目标；协议、影子代理、Sol、映射及能力回归通过。
      truncated: false
