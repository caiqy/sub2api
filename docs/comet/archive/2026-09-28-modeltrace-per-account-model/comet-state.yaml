acceptance:
  - id: A1
    source: brief.md
    text: "**WHEN** 账号未配置独立检测模型且全局模型为 `gpt-6-astra`"
    result: passed
    reason:
      text: An absent account override resolves to the global default.
      truncated: false
  - id: A2
    source: brief.md
    text: "**THEN** 后续自动任务使用 `gpt-6-astra`；修改全局模型只影响未配置账号的后续任务。 ### Scenario:
      账号模型覆盖全局模型"
    result: passed
    reason:
      text: Automatic enqueue snapshots the inherited global model for subsequent
        tasks.
      truncated: false
  - id: A3
    source: brief.md
    text: "**WHEN** 账号配置 `gpt-6-sol` 且全局模型为 `gpt-6-astra`"
    result: passed
    reason:
      text: A configured GPT account override is accepted independently of the global
        model.
      truncated: false
  - id: A4
    source: brief.md
    text: "**THEN** 后续自动任务使用 `gpt-6-sol`，不使用全局模型。 ### Scenario: 模型配置快照与排队任务"
    result: passed
    reason:
      text: Automatic enqueue selects and persists the account override, not the
        global model.
      truncated: false
  - id: A5
    source: brief.md
    text: "**WHEN** 账号模型配置在任务排队后、探针发送前发生变化"
    result: passed
    reason:
      text: Queued automatic tasks compare persisted override provenance and selected
        model before the first send.
      truncated: false
  - id: A6
    source: brief.md
    text: "**THEN** 旧排队任务不发送请求并记录失败或跳过原因；已发送任务不被强行取消，完成后保留原模型历史。 ### Scenario:
      手动模型列表按平台限定"
    result: passed
    reason:
      text: The final first-round check after the repository fence records a failed
        unsent task on override change; completed first rounds continue on their
        snapshot.
      truncated: false
  - id: A7
    source: brief.md
    text: "**WHEN** 管理员打开 OpenAI 账号的手动检测弹窗或全局 ModelTrace 设置"
    result: passed
    reason:
      text: Global settings and OpenAI manual modal obtain the ModelTrace model
        catalog.
      truncated: false
  - id: A8
    source: brief.md
    text: "**THEN** 列表来自 ModelTrace 当前 GPT 模型，包含未被该账号映射配置的模型，但不包含 Claude 等非 OpenAI
      模型。 ### Scenario: 直接调用所选模型"
    result: passed
    reason:
      text: The catalog selects GPT family fingerprints and is not filtered by account
        mappings.
      truncated: false
  - id: A9
    source: brief.md
    text: "**WHEN** 管理员或自动任务选择 `gpt-6-sol` 发起检测"
    result: passed
    reason:
      text: Manual and automatic requests retain their selected GPT model ID.
      truncated: false
  - id: A10
    source: brief.md
    text: "**THEN** 探针使用所选账号的凭据、协议、代理，并将 `gpt-6-sol` 作为实际上游模型
      ID；不得改用账号映射目标、全局模型或其他账号。 ### Scenario: 所选模型暂不可调用"
    result: passed
    reason:
      text: Probe payload uses the selected ID with the selected account's credential
        owner, protocol, and proxy; no mapping substitution.
      truncated: false
  - id: A11
    source: brief.md
    text: "**WHEN** 配置模型仍属于 ModelTrace 列表，但账号凭据、协议或上游不支持该模型"
    result: passed
    reason:
      text: Catalog validation permits configuration without current account
        capability or credentials.
      truncated: false
  - id: A12
    source: brief.md
    text: "**THEN** 配置仍可保存；检测实际尝试所选模型，失败时记录脱敏失败原因，不静默换用其他模型。"
    result: passed
    reason:
      text: Credential and upstream failures become sanitized task history; no
        fallback target is selected.
      truncated: false
  - id: A13
    source: specs/modeltrace-degradation-detection/spec.md
    text: 账号和模型隔离 - **WHEN** 管理员选择某 OpenAI 账号及一个当前 ModelTrace GPT 模型发起检测 - **THEN**
      探针使用该账号的凭据归属、协议及业务代理，直接发送选择的模型 ID，不得换用其他账号、映射目标或全局模型。
    result: passed
    reason:
      text: Probe and transport tests verify account identity, parent credential
        ownership, proxy and unmodified target.
      truncated: false
  - id: A14
    source: specs/modeltrace-degradation-detection/spec.md
    text: OpenAI 模型列表 - **WHEN** 管理员打开全局 ModelTrace 设置或 OpenAI 账号的手动检测弹窗 - **THEN**
      列表来自当前 ModelTrace GPT 模型，包含未被账号映射配置的模型，不包含 Claude 或其他非 OpenAI 家族模型。
    result: passed
    reason:
      text: Global and account-specific model APIs expose the GPT-only fingerprint
        list without mapping filtering.
      truncated: false
  - id: A15
    source: specs/modeltrace-degradation-detection/spec.md
    text: 不可调用模型 - **WHEN** 所选模型仍在 ModelTrace GPT 列表中，但账号凭据、协议或上游暂不支持该模型 - **THEN**
      配置可以保存，检测实际尝试该模型并记录脱敏失败原因，不改用其他模型。
    result: passed
    reason:
      text: Valid catalog choices save without capability checks and failed probes
        preserve a sanitized failure without substitution.
      truncated: false
  - id: A16
    source: specs/modeltrace-degradation-detection/spec.md
    text: 单轮与多轮评分 - **WHEN** 分别完成 1、2 或 3 轮有效挑战 - **THEN**
      各自使用相应样本数校准，归因第一名等于实际所选模型则记录正常，否则记录降智；概率和指纹库版本可查询。
    result: passed
    reason:
      text: All requested valid samples are scored with sample-count calibration and
        the selected target determines normal versus degraded.
      truncated: false
  - id: A17
    source: specs/modeltrace-degradation-detection/spec.md
    text: 部分失败 - **WHEN** 请求 3 轮检测但仅 2 轮有效，或实际所选模型返回上游错误 - **THEN**
      历史记录为失败并展示有效轮次和脱敏原因，不自动补发、不覆盖账号此前有效结论。
    result: passed
    reason:
      text: Partial rounds and upstream errors finish as failures without publishing a
        new conclusion or hidden retry.
      truncated: false
  - id: A18
    source: specs/modeltrace-degradation-detection/spec.md
    text: 关闭并重新打开 - **WHEN** 手动任务执行中关闭弹窗再重新打开 - **THEN**
      任务继续运行，界面恢复其进度或结果，不因打开动作重复发起模型请求。
    result: passed
    reason:
      text: The modal restores active task history after reopening without starting
        another request.
      truncated: false
  - id: A19
    source: specs/modeltrace-degradation-detection/spec.md
    text: 热更新和关闭 - **WHEN** 管理员保存有效设置或关闭自动检测 - **THEN**
      后续调度使用新配置，关闭后不再启动排队或新自动任务，手动检测仍可用；非法参数拒绝保存且不改变原配置。
    result: passed
    reason:
      text: Settings validation rejects invalid updates; hot reads and automatic
        eligibility honor the global switch while manual starts remain
        available.
      truncated: false
  - id: A20
    source: specs/modeltrace-degradation-detection/spec.md
    text: 开关和模型继承 - **WHEN** 全局开启但账号自动开关关闭，或账号未配置模型覆盖 - **THEN**
      账号在前一种情况下不自动检测但仍可手动检测；在后一种情况下使用当前全局模型创建后续自动任务。
    result: passed
    reason:
      text: Account auto switch gates scheduling; absent override inherits the global
        model; manual starts ignore automatic switches.
      truncated: false
  - id: A21
    source: specs/modeltrace-degradation-detection/spec.md
    text: 账号模型覆盖 - **WHEN** 全局模型为 `gpt-6-astra`，账号覆盖模型为 `gpt-6-sol` - **THEN**
      该账号后续自动任务使用 `gpt-6-sol`，不使用全局模型。
    result: passed
    reason:
      text: Account model selection takes precedence over the global setting at
        automatic task creation.
      truncated: false
  - id: A22
    source: specs/modeltrace-degradation-detection/spec.md
    text: 模型配置快照 - **WHEN** 账号模型覆盖在自动任务排队后、探针发送前发生变化 - **THEN**
      旧排队任务不发送请求并记录配置变化原因；已发送任务使用创建时模型完成，历史保留其模型。
    result: passed
    reason:
      text: Last check before first probe skips changed overrides; after a valid first
        round no override recheck aborts later rounds, preserving the task
        snapshot and history.
      truncated: false
  - id: A23
    source: specs/modeltrace-degradation-detection/spec.md
    text: 账号模型暂不可用 - **WHEN** 账号保存了合法 ModelTrace 模型但当前凭据、协议或上游不能调用它 - **THEN**
      保存成功，自动或手动检测实际调用该模型并记录失败，不回退其他模型。
    result: passed
    reason:
      text: Unsupported current account credentials or upstream capability fail
        against the selected model without fallback.
      truncated: false
  - id: A24
    source: specs/modeltrace-degradation-detection/spec.md
    text: 手动与自动降智 - **WHEN** 已开启隔离策略的账号完成手动或自动检测且有效结论为降智 - **THEN**
      整个账号进入临时不可调用状态，其他模型也不被业务调度选中，检测历史记录所选模型。
    result: passed
    reason:
      text: Latest successful degraded result applies account-level quarantine and
        retains the selected model in history.
      truncated: false
  - id: A25
    source: specs/modeltrace-degradation-detection/spec.md
    text: 隔离期间仍可自动复检 - **WHEN** 账号仅因 ModelTrace 降智处于临时不可调用状态且自动检测开关仍开启 - **THEN**
      账号按其有效间隔继续接受使用有效账号模型的 ModelTrace 复检；有效正常结论可解除隔离，失败、超时或继续降智不得放开业务调度。
    result: passed
    reason:
      text: Own ModelTrace quarantine does not prevent scheduled recovery probes,
        while independent account blockers still do.
      truncated: false
  - id: A26
    source: specs/modeltrace-degradation-detection/spec.md
    text: 手动恢复与策略关闭 - **WHEN** 管理员手动检测得到有效正常结论，或关闭账号的降智隔离策略 - **THEN** 解除仅由
      ModelTrace 造成的隔离；若存在其他独立原因，账号仍保持不可调用。
    result: passed
    reason:
      text: Successful normal detection or disabling the policy clears only ModelTrace
        quarantine, retaining other blockers.
      truncated: false
  - id: A27
    source: specs/modeltrace-degradation-detection/spec.md
    text: 账号级最新有效结论 - **WHEN** 同账号模型 A 有效降智、随后模型 B 有效正常，接着发生一次失败检测 - **THEN** 模型 A
      的降智先使账号隔离，模型 B 的正常解除隔离，最后失败不重新隔离；评分历史保留各次模型与结论。
    result: passed
    reason:
      text: The latest successful task updates the account summary/quarantine;
        subsequent failures leave it unchanged.
      truncated: false
  - id: A28
    source: specs/modeltrace-degradation-detection/spec.md
    text: 来源和持久化 - **WHEN** 同账号先后执行手动与自动检测后刷新页面或重启服务 - **THEN** 30
      天内的记录可分页查询并准确区分来源、所选模型、实际请求模型、轮次及结论；非管理员不能读取或触发检测。
    result: passed
    reason:
      text: 241 matches its committed original blob exactly; embedded 243 adds
        model_override for existing databases, repository scans and paginated
        history include it without exposing secrets; existing admin boundary
        remains.
      truncated: false
  - id: A29
    source: specs/modeltrace-degradation-detection/spec.md
    text: 多模型最近结果 - **WHEN** 同账号 Astra 检测降智后 Sol 检测正常，再发生一次请求失败 - **THEN**
      状态列显示最近有效的正常结果并标明 Sol 和检测时间，历史保留 Astra 降智及最新失败；点击状态进入该账号历史页签。
    result: passed
    reason:
      text: Account status uses the retained latest valid model/time and the history
        entry point; failed tasks do not replace the summary.
      truncated: false
  - id: A30
    source: specs/modeltrace-degradation-detection/spec.md
    text: 并发与中断 - **WHEN** 多实例或手动/自动同时请求检测同一账号，或执行中服务中断 - **THEN**
      同账号最多一个任务执行，其他触发复用或等待既有任务；中断留下可查询的失败结果，不以正常/降智掩盖故障，也不自动重发已经发送的轮次。
    result: passed
    reason:
      text: Database lease, account active-slot and interruption recovery prevent
        overlapping or replayed tasks; focused checks passed.
      truncated: false
