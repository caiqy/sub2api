 lint:check/typecheck/test:run/build（含 i18n）由 Runtime 真实执行并绑定候选，新的独立只读 Verifier 覆盖 A1-A9。数据库/Redis 及 fake upstream 定向验证按实际环境执行；skip、超时、未运行和历史结果不能算业务通过。"},{"id":"A9","source":"brief.md","text":"A9：只编辑允许的正式 brief/Spec 等产物，阶段/检查/报告/事务由公开 Runtime 管理；真实不可共存的语义冲突先确认，完整验收后等待用户接受与交付选择；结束时完成项目经验和学习检查，不将进度/测试输出写作个人记忆。"}],"children":null,"formalHash":"9186450b03cd814de0a7b084b9aebc435f1d64d3c73ece0621e7a72dc5de7fe3","shapeConfirmationHash":"31ccba5cd658b9ffb7b49a6c1328ec1af6014daf40202c713776d66dd8448080","specChanges":[{"capability":"upstream-tag-fusion-20261029","operation":"create","source":"specs/upstream-tag-fusion-20261029/spec.md"}]}}},"proposalHash":"c3bb75cd22fb4a2eed49c0b1b88ac13445e859859353bc07ba2f3602ed1ac501","choices":["approved","rejected"],"results":{},"decision":{"id":"d4b55582d305cea97b80e6c08378bc61efcc1265cd28ed1e242f00aa11fa1ee3","choice":"approved","proposalHash":"c3bb75cd22fb4a2eed49c0b1b88ac13445e859859353bc07ba2f3602ed1ac501"}},{"id":"merge-upstream-tags-20261029:10","stepId":"verify.confirm","sequence":10,"status":"resolved","proposal":{"input":{"artifactRootRef":"docs","name":"merge-upstream-tags-20261029"},"outputs":{"verify.report":{"candidateId":"32ab6bbc6c68dc26c9f8bc8c182ba22d868bd1a2f9e41f6efc3e08f2b37afb4e","reportRef":"docs/comet/changes/merge-upstream-tags-20261029/verification.md","reportSha256":"bc68d05501eb71cdc583b0a2ddd8f690ca49a4d268277a646d5a0f9fc4e53238","stateVersion":8}}},"proposalHash":"b2b8df58495d5defff67800a3943d4e547743a9fb46e612e0ce8f87e10b84f17","choices":["approved","rejected","reverify"],"results":{},"decision":{"id":"37a4a8ac67dfab57874fba3c426ac6f5144be6e933ed91f026b9a7e41982285a","choice":"reverify","proposalHash":"b2b8df58495d5defff67800a3943d4e547743a9fb46e612e0ce8f87e10b84f17"}},{"id":"merge-upstream-tags-20261029:20","stepId":"verify.confirm","sequence":20,"status":"resolved","proposal":{"input":{"artifactRootRef":"docs","name":"merge-upstream-tags-20261029"},"outputs":{"verify.report":{"candidateId":"fa3b11b8fe63b