"results":{},"sequence":7},"group-input-context-limit:8":{"results":{},"sequence":8},"group-input-context-limit:9":{"results":{},"sequence":9}},"waits":[{"id":"group-input-context-limit:2","stepId":"shape.confirm","sequence":2,"status":"resolved","proposal":{"input":{"artifactRootRef":"docs","name":"group-input-context-limit"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"A1：默认关闭；配置/关闭/开启可保存，关闭保留各组阈值，无限制快速路径不计数。"},{"id":"A2","source":"brief.md","text":"A2：组A=64000、组B=128000，同一计数为80000的请求A拒绝B放行；等于阈值放行，超过1拒绝。"},{"id":"A3","source":"brief.md","text":"A3：非法组/负数/小数/溢出拒绝且不污染旧配置；保存失败不发布快照；refresh不会覆盖较新的save。"},{"id":"A4","source":"brief.md","text":"A4：原绑定组、有效组、合成平台映射和回退按Q2工作；本地拒绝不触发宽松组回退。"},{"id":"A5","source":"brief.md","text":"A5：文本历史、system、tools/schema、调用参数与结果计入；输出预算不计，缓存不打折；Q1选项对多模态/历史/密文/计数失败有明确且测试过的结果。"},{"id":"A6","source":"brief.md","text":"A6：HTTP七个接点和现有别名均覆盖；count端点不拦，compact行为服从Q3；专用非对话入口范围可核对。"},{"id":"A7","source":"brief.md","text":"A7：Messages/OpenAI/Gemini协议状态码及关键字段正确；Responses流式遵从Q4，keepalive不能抢先破坏所选契约。"},{"id":"A8","source":"brief.md","text":"A8：Responses WS首帧、第二轮、两种ingress都检查，返回可解析的终态且无上游生成；拒绝后按约定关闭连接。"},{"id":"A9","source":"brief.md","text":"A9：策略拒绝不产生账号惩罚、重试、生成计费和正文日志；配置按单请求/turn快照读取。"},{"id":"A10","source":"brief.md","text":"A10：保存节点下一请求读取新配置，健康多节点60秒内刷新；DB故障保留last-known，未知首次值行为与告警可验证。"},{"id":"A11","source":"specs/group-input-context-limit/spec.md","text":"关闭时无额外检查 - Given 无配置或总开关关闭 - When 请求进入覆盖入口 - Then 不读取正文进行本策略计数，也不因遗留阈值拒绝 - Acceptance: A1"},{"id":"A12","source":"specs/group-input-context-limit/spec.md","text":"非法配置与保存失败 - Given 有旧配置 - When 提交无效组/负数/小数/溢出值或保存失败 - Then 返回管理接口错误且不发布部分新配置 - Acceptance: A3"},{"id":"A13","source":"specs/group-input-context-limit/spec.md","text":"分组边界 - Given A=64000，B=128000 - When 同样输入计数80000 - Then A拒绝B放行；64000在A放行，64001拒绝 - Acceptance: A2"},{"id":"A14","source":"specs/group-input-context-limit/spec.md","text":"合成平台与供给组切换 - Given 原绑定组与最终实际组不同，或触发候选组回退 - When 判定策略 - Then 两组取较小非零阈值；本地拒绝终止；模型/转换变化时重新估算 - Acceptance: A4"},{"id":"A15","source":"specs/group-input-context-limit/spec.md","text":"工具与隐藏输入 - Given 请求包含工具参数/结果以及多模态或历史引用 - When 本地估算 - Then 可见工具和文本纳入，记录coverage；未知部分交上游；同样输入改变max_output_tokens不改变本策略结果 - Acceptance: A5"},{"id":"A16","source":"specs/group-input-context-limit/spec.md","text":"所有声明入口及别名 - Given 任一覆盖入口及别名 - When 同样组策略和可见超限输入 - Then 都判定超限；count与真实compact不因本策略拦截 - Acceptance: A6"},{"id":"A17","source":"specs/group-input-context-limit/spec.md","text":"三协议与Responses流式契约 - Given 相同超限输入通过不同协议 - When 准入拒绝 - Then 返回相应协议关键字段；Responses stream=true得到200及response.failed，其余HTTP入口得到400；keepalive不破坏所选契约 - Acceptance: A7"},{"id":"A18","source":"specs/group-input-context-limit/spec.md","text":"首轮与第二轮超限 - Given WS第一轮正常、第二轮超限，或第一轮即超限 - When 请求到达 - Then 对应轮不发送生成请求，客户端收到合法失败终态，连接按约定关闭 - Acceptance: A8"},{"id":"A19","source":"specs/group-input-context-limit/spec.md","text":"拒绝的账务及调度副作用 - Given 策略拒绝 - When 请求结束 - Then 无生成调用、重试、账号惩罚和生成扣费，日志无输入正文 - Acceptance: A9"},{"id":"A20","source":"specs/group-input-context-limit/spec.md","text":"更新与故障回源 - Given 保存和旧refresh并发 - When 旧refresh晚完成 - Then 不覆盖较新save；健康节点按TTL更新；故障保留已知配置 - Acceptance: A10"}],"children":null,"formalHash":"3bfae4315a1610d63b12cc8767963fc7ba44eba301704bf7dc4ac954a3dc64c9","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"d1d2e61b48dd8c85873b5c5399167b459ff4a3ea9c11c8361c5d3b5ce1b12d53","contractHash":"83ff24f4b5c4be2826d0e9b93db770c7afef060189a40a646be7f0873830d4bc","inputHash":"4f9f0bb910aaa47610a5b536498fb5d4ee87380f9b775ee6069c2c2f1a4a5c81","legacyFingerprint":"2d3bea15adf34b316ebf989a94a69613738d02f363890c944954e0de33c3a941","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"f296593a7881c04390af896611ef49975e93e060af6119631e31c108966876d3","contractHash":"6cda037cc82ab369d564eb7ab39a027b34f9d96665059a936fd39504